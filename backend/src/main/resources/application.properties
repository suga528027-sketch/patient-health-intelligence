# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/healthplatform
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# Keep this secret strong and secure in production
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiry time in milliseconds (e.g., 86400000ms = 24 hours)
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/

# Spring AI Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.project-id=dummy-project-id
spring.ai.google.genai.embedding.project-id=dummy-project-id
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}

# Qdrant Vector DB Configuration
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection-name=patient_reports