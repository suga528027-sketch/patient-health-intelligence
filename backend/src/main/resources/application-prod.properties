# ===================================================================
# Production Profile Configuration (application-prod.properties)
# ===================================================================

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:healthplatform}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${UPLOAD_DIR:uploads/}

# Spring AI Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.project-id=${GOOGLE_PROJECT_ID:dummy-project-id}
spring.ai.google.genai.embedding.project-id=${GOOGLE_PROJECT_ID:dummy-project-id}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Qdrant Vector DB Configuration
qdrant.url=${QDRANT_URL}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection-name=${QDRANT_COLLECTION:patient_reports}
